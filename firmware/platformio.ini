; HueWheel firmware. See firmware/README.md for setup and upload steps.

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
