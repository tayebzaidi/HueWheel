# Backstop for clones without the local hooks. It runs after a push, so a failure
# here means the content is already public: treat any secret it finds as leaked.
name: Secret scan
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/check_secrets.py --all
